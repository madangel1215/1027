<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件嚴格差異比對流程</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f8fafc;
      --color-ink:    #0f172a;
      --color-muted:  #475569;
      --color-soft:   #64748b;
      --color-accent: #2563eb;
      --font-sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Noto Serif TC', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 600px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Document Diff Compare</p>
    <h1>文件嚴格差異比對流程</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 600 972" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diff-compare-flow-title diff-compare-flow-desc">
        <title id="diff-compare-flow-title">文件嚴格差異比對流程</title>
        <desc id="diff-compare-flow-desc">流程圖：兩份文件逐列正規化後比對，分出新增、刪除、修改三種差異，抽取金額日期天數判定重要度高低，最後排序並產出五段式核對報告。</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#475569"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8fafc"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <!-- 開始 → 逐列切行並正規化 -->
        <line x1="300" y1="96" x2="300" y2="128" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 逐列切行並正規化 → 此列有差異？ -->
        <line x1="300" y1="184" x2="300" y2="216" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 此列有差異？→ 差異類型？ -->
        <line x1="300" y1="304" x2="300" y2="336" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 此列有差異？→ 無差異 → 回到下一列（虛線迴圈） -->
        <path d="M 180,260 H 100 A 8 8 0 0 1 92,252 V 164 A 8 8 0 0 1 100,156 H 140"
              fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- 差異類型？→ 修改 → 抽取金額日期天數 -->
        <line x1="300" y1="424" x2="300" y2="456" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 差異類型？→ 刪除 → 差異清單 -->
        <path d="M 180,380 H 124 A 8 8 0 0 0 116,388 V 684 A 8 8 0 0 0 124,692 H 140"
              fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 差異類型？→ 新增 → 差異清單 -->
        <path d="M 420,380 H 500 A 8 8 0 0 1 508,388 V 697 A 8 8 0 0 1 500,705 H 460"
              fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 抽取金額日期天數 → 關鍵數值有差異？ -->
        <line x1="300" y1="512" x2="300" y2="544" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 關鍵數值有差異？→ 是（高重要度）→ 差異清單 -->
        <path d="M 420,588 H 468 A 8 8 0 0 1 476,596 V 671 A 8 8 0 0 1 468,679 H 460"
              fill="none" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- 關鍵數值有差異？→ 否（中或低）→ 差異清單 -->
        <line x1="300" y1="632" x2="300" y2="664" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 差異清單 → 排序並產出五段式報告 -->
        <line x1="300" y1="720" x2="300" y2="752" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 排序並產出五段式報告 → 結束 -->
        <line x1="300" y1="808" x2="300" y2="840" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels (opaque mask + text, 6px clear of the stroke) -->
        <rect x="308" y="312" width="52" height="16" rx="2" fill="#f8fafc"/>
        <text x="334" y="324" fill="#475569" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">有差異</text>

        <rect x="100" y="200" width="52" height="16" rx="2" fill="#f8fafc"/>
        <text x="126" y="212" fill="#475569" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">無差異</text>

        <rect x="308" y="432" width="40" height="16" rx="2" fill="#f8fafc"/>
        <text x="328" y="444" fill="#475569" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">修改</text>

        <rect x="132" y="404" width="76" height="16" rx="2" fill="#f8fafc"/>
        <text x="170" y="416" fill="#475569" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">刪除（中）</text>

        <rect x="424" y="404" width="76" height="16" rx="2" fill="#f8fafc"/>
        <text x="462" y="416" fill="#475569" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">新增（中）</text>

        <rect x="434" y="566" width="28" height="16" rx="2" fill="#f8fafc"/>
        <text x="448" y="578" fill="#2563eb" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">高</text>

        <rect x="308" y="640" width="52" height="16" rx="2" fill="#f8fafc"/>
        <text x="334" y="652" fill="#475569" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">中或低</text>

        <!-- Nodes -->
        <!-- 開始 (oval) -->
        <rect x="140" y="40" width="320" height="56" rx="20" fill="#f8fafc"/>
        <rect x="140" y="40" width="320" height="56" rx="20" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <text x="300" y="65" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">開始</text>
        <text x="300" y="82" fill="#475569" font-size="12" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">貼上文件 A、B 與比對選項</text>

        <!-- 逐列切行並正規化 -->
        <rect x="140" y="128" width="320" height="56" rx="6" fill="#f8fafc"/>
        <rect x="140" y="128" width="320" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <text x="300" y="153" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">逐列切行並正規化</text>
        <text x="300" y="170" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">split('\n') · normalize()</text>

        <!-- 此列有差異？ (diamond) -->
        <rect x="180" y="216" width="240" height="88" fill="#f8fafc"/>
        <polygon points="300,216 420,260 300,304 180,260" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <text x="300" y="265" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">此列有差異？</text>

        <!-- 差異類型？ (diamond) -->
        <rect x="180" y="336" width="240" height="88" fill="#f8fafc"/>
        <polygon points="300,336 420,380 300,424 180,380" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <text x="300" y="385" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">差異類型？</text>

        <!-- 抽取金額 · 日期 · 天數 -->
        <rect x="140" y="456" width="320" height="56" rx="6" fill="#f8fafc"/>
        <rect x="140" y="456" width="320" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <text x="300" y="481" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">抽取金額 · 日期 · 天數</text>
        <text x="300" y="498" fill="#64748b" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">numRegex</text>

        <!-- 關鍵數值有差異？ (diamond, focal) -->
        <rect x="180" y="544" width="240" height="88" fill="#f8fafc"/>
        <polygon points="300,544 420,588 300,632 180,588" fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="1"/>
        <text x="300" y="593" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">關鍵數值有差異？</text>

        <!-- 差異清單（附重要度） -->
        <rect x="140" y="664" width="320" height="56" rx="6" fill="#f8fafc"/>
        <rect x="140" y="664" width="320" height="56" rx="6" fill="rgba(15,23,42,0.05)" stroke="#475569" stroke-width="1"/>
        <text x="300" y="689" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">差異清單（附重要度）</text>
        <text x="300" y="706" fill="#475569" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">diffs[]</text>

        <!-- 排序並產出五段式報告 -->
        <rect x="140" y="752" width="320" height="56" rx="6" fill="#f8fafc"/>
        <rect x="140" y="752" width="320" height="56" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <text x="300" y="777" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">排序並產出五段式報告</text>
        <text x="300" y="794" fill="#64748b" font-size="12" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">結論 · 差異清單 · 不確定 · 自我檢查 · 工具筆記</text>

        <!-- 結束 (oval) -->
        <rect x="140" y="840" width="320" height="48" rx="20" fill="#f8fafc"/>
        <rect x="140" y="840" width="320" height="48" rx="20" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <text x="300" y="869" fill="#0f172a" font-size="12" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" text-anchor="middle">結束</text>

        <!-- Legend -->
        <line x1="40" y1="912" x2="560" y2="912" stroke="rgba(15,23,42,0.10)" stroke-width="0.8"/>
        <text x="40" y="928" fill="#475569" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">圖例</text>

        <rect x="80" y="940" width="24" height="14" rx="7" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1"/>
        <text x="112" y="951" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">開始／結束</text>

        <rect x="188" y="940" width="24" height="14" rx="2" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <text x="220" y="951" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">步驟</text>

        <polygon points="272,940 284,947 272,954 260,947" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <text x="292" y="951" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">判斷</text>

        <line x1="332" y1="947" x2="360" y2="947" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="368" y="951" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">高重要度路徑</text>

        <line x1="456" y1="947" x2="484" y2="947" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="492" y="951" fill="#475569" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif">略過此列</text>
      </svg>
    </div>
  </div>
</body>
</html>
